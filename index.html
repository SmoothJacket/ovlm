<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVLM — Open-Vision Launch Monitor</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; }
      body {
        background: #ffffff;
        color: #000000;
        font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
        -webkit-font-smoothing: antialiased;
      }
      /* Light theme via global colour invert — flips every inline-styled
         dark surface to its light counterpart in one shot. Images, videos,
         iframes and embedded canvases get the inverse filter so the camera
         feeds and the 3-D stadium iframe stay correct (otherwise we'd be
         looking at colour-negative pixels). */
      html {
        filter: invert(1) hue-rotate(180deg);
        -webkit-filter: invert(1) hue-rotate(180deg);
        background: #ffffff;
      }
      img, video, canvas, iframe, picture, svg image {
        filter: invert(1) hue-rotate(180deg);
        -webkit-filter: invert(1) hue-rotate(180deg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
